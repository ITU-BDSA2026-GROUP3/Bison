name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore

    - name: Cache Playwright
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/*.csproj') }}

    - name: Install Playwright Browsers (If not cached)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pwsh test/PlaywrightTests/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

    - name: Install Playwright Browsers (If cached)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: pwsh test/PlaywrightTests/bin/Debug/net8.0/playwright.ps1 install-deps chromium

    - name: Test
      run: dotnet test --no-build --verbosity normal
